name: Desktop packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install local test tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y blender ffmpeg
      - name: Install local test tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg && brew install --cask blender
      - name: Install local test tools (Windows)
        if: runner.os == 'Windows'
        run: choco install blender ffmpeg -y --no-progress
      - run: npm ci
      - run: npm run typecheck
      - name: Full tests (macOS and Linux)
        if: runner.os != 'Windows'
        run: npm test
      - name: Windows tests
        if: runner.os == 'Windows'
        run: npm test -- --exclude packages/providers/src/probe.test.ts
        # This suite creates Unix executable shell fixtures. Other tests still run.
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: XENIUR-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
